[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.1.0"
description = "A modular personal assistant with messaging and scheduled capabilities."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx",
    "sqlalchemy",
    "psycopg[binary,pool]",
    "alembic",
    "langgraph",
    "langchain-core",
    "aiosqlite",
    "langgraph-checkpoint-postgres",
    "langgraph-checkpoint-sqlite",
    "openai",
    "jsonschema",
    "procrastinate",
]

[project.scripts]
personal-agent = "personal_agent.entrypoints.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
